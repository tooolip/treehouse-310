<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Treehouse 310</title>
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito:wght@400;600;700;800&display=swap">
	<link rel="stylesheet" href="/app.css">
	<link rel="icon" href="/favicon.svg">
	<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/18.0.0/lib/marked.umd.min.js" integrity="sha384-3oYgyohyKGID0Mjf4sv9mBRVGZQ7v30l8A1LknUrjwfSYZNT8rPZlBIuyXJWU2Xs" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
	<script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.4.16/purify.min.js" integrity="sha384-a7SzOxErzJ3ZpQz0zJ32d67dSitNzPcbfybc/ykU9KJhMgZkwqfSxlhhdJRS+XGL" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
	<script src="/app.js" defer></script>
</head>
<body>
	<main id="login" class="login" hidden>
		<form id="login-form" class="card">
			<svg class="art" viewBox="0 0 120 132" aria-hidden="true"><ellipse cx="60" cy="127" rx="48" ry="5" fill="#8cc06b"/><circle cx="34" cy="48" r="24" fill="#6fae57"/><circle cx="86" cy="48" r="24" fill="#6fae57"/><circle cx="60" cy="34" r="30" fill="#7fbf63"/><rect x="53" y="62" width="14" height="66" rx="3" fill="#8a5a32"/><path d="M60 100l-12-10M60 92l11-9" stroke="#8a5a32" stroke-width="5" stroke-linecap="round"/><polygon points="28,50 60,24 92,50" fill="#d0688a"/><rect x="34" y="48" width="52" height="26" rx="3" fill="#c48a52"/><rect x="47" y="54" width="13" height="11" rx="2" fill="#ffd66b"/><path d="M53.5 54v11M47 59.5h13" stroke="#a8713f" stroke-width="1.5"/><rect x="67" y="57" width="11" height="17" rx="5" fill="#7c4f2a"/><rect x="24" y="73" width="72" height="6" rx="3" fill="#7c4f2a"/><path d="M30 79v46M40 79v46M30 88h10M30 98h10M30 108h10M30 118h10" stroke="#a8713f" stroke-width="2.5" stroke-linecap="round"/></svg>
			<h1>Treehouse 310</h1>
			<p class="muted">Paste your key to climb up. It stays in this browser.</p>
			<input id="login-key" type="password" autocomplete="current-password" placeholder="Your key" required>
			<p id="login-error" class="error" hidden></p>
			<button type="submit" class="primary">Climb up</button>
		</form>
	</main>

	<div id="app" hidden>
		<header class="top">
			<span class="brand"><svg class="logo" viewBox="0 0 120 132" aria-hidden="true"><ellipse cx="60" cy="127" rx="48" ry="5" fill="#8cc06b"/><circle cx="34" cy="48" r="24" fill="#6fae57"/><circle cx="86" cy="48" r="24" fill="#6fae57"/><circle cx="60" cy="34" r="30" fill="#7fbf63"/><rect x="53" y="62" width="14" height="66" rx="3" fill="#8a5a32"/><path d="M60 100l-12-10M60 92l11-9" stroke="#8a5a32" stroke-width="5" stroke-linecap="round"/><polygon points="28,50 60,24 92,50" fill="#d0688a"/><rect x="34" y="48" width="52" height="26" rx="3" fill="#c48a52"/><rect x="47" y="54" width="13" height="11" rx="2" fill="#ffd66b"/><path d="M53.5 54v11M47 59.5h13" stroke="#a8713f" stroke-width="1.5"/><rect x="67" y="57" width="11" height="17" rx="5" fill="#7c4f2a"/><rect x="24" y="73" width="72" height="6" rx="3" fill="#7c4f2a"/><path d="M30 79v46M40 79v46M30 88h10M30 98h10M30 108h10M30 118h10" stroke="#a8713f" stroke-width="2.5" stroke-linecap="round"/></svg>Treehouse 310</span>
			<nav>
				<button data-tab="chat">Chat</button>
				<button data-tab="notes">Notes</button>
				<button data-tab="files">Files</button>
			</nav>
			<span class="who"><span id="me"></span> · <button id="sign-out" class="link">Sign out</button></span>
		</header>

		<section id="tab-chat" class="tab chat" hidden>
			<aside class="side">
				<h2>Channels</h2>
				<ul id="channels" class="list"></ul>
				<form id="new-channel" class="inline">
					<input name="name" placeholder="new-channel" aria-label="New channel name">
					<button type="submit">Add</button>
				</form>
			</aside>
			<div class="pane">
				<h2 id="channel-title"></h2>
				<div id="messages" class="messages"></div>
				<form id="composer" class="composer">
					<div class="attachment" hidden></div>
					<label class="attach" title="Add a picture"><input type="file" name="file" accept="image/*" hidden><span aria-hidden="true">🖼️</span><span class="sr-only">Add a picture</span></label>
					<textarea name="text" rows="2" placeholder="Say something to start a thread"></textarea>
					<button type="submit" class="primary">Send</button>
				</form>
			</div>
			<aside id="thread" class="thread" hidden>
				<div class="thread-head"><h2>Thread</h2><button id="close-thread" class="link">Close</button></div>
				<div id="thread-messages" class="messages"></div>
				<form id="reply-composer" class="composer">
					<div class="attachment" hidden></div>
					<label class="attach" title="Add a picture"><input type="file" name="file" accept="image/*" hidden><span aria-hidden="true">🖼️</span><span class="sr-only">Add a picture</span></label>
					<textarea name="text" rows="2" placeholder="Reply"></textarea>
					<button type="submit" class="primary">Reply</button>
				</form>
			</aside>
		</section>

		<section id="tab-notes" class="tab notes" hidden>
			<aside class="side">
				<div class="side-head"><h2>Notes</h2><button id="new-root-note">New page</button></div>
				<div id="note-tree"></div>
			</aside>
			<div class="pane">
				<div id="note-empty" class="empty">
					<p>Pick a page, or plant a new one.</p>
				</div>
				<article id="note" hidden>
					<div class="note-head">
						<div>
							<p id="note-path" class="muted"></p>
							<h1 id="note-title"></h1>
							<p id="note-meta" class="muted"></p>
						</div>
						<div class="actions">
							<button id="note-edit">Edit</button>
							<button id="note-child">New page inside</button>
							<button id="note-move">Move</button>
							<button id="note-delete" class="danger">Delete</button>
						</div>
					</div>
					<div id="note-body" class="markdown"></div>
					<form id="note-editor" class="editor" hidden>
						<textarea name="body" rows="20"></textarea>
						<div class="actions">
							<button type="submit" class="primary">Save</button>
							<button type="button" id="note-cancel">Cancel</button>
						</div>
					</form>
				</article>
			</div>
		</section>

		<section id="tab-files" class="tab files" hidden>
			<div class="pane wide">
				<form id="upload" class="upload card">
					<input type="file" name="file" required aria-label="File">
					<input name="description" placeholder="What is it? (optional)" aria-label="Description">
					<button type="submit" class="primary">Upload</button>
				</form>
				<p id="upload-error" class="error" hidden></p>
				<table class="file-table">
					<thead><tr><th>Name</th><th>Size</th><th>From</th><th>Added</th><th></th></tr></thead>
					<tbody id="file-rows"></tbody>
				</table>
				<p id="files-empty" class="empty" hidden>Nothing stashed up here yet. Upload something above.</p>
				<div id="preview" class="preview card" hidden></div>
			</div>
		</section>
	</div>
</body>
</html>
