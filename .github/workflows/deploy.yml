name: Deploy

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'public/**'
      - 'migrations/**'
      - 'package.json'
      - 'package-lock.json'
      - 'wrangler.jsonc'
      - 'tsconfig.json'
      - 'worker-configuration.d.ts'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

concurrency: deploy

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Restore private deployment configuration
        env:
          WRANGLER_CONFIG_JSON: ${{ secrets.WRANGLER_CONFIG_JSON }}
        run: |
          test -n "$WRANGLER_CONFIG_JSON"
          printf '%s' "$WRANGLER_CONFIG_JSON" > wrangler.production.jsonc
          node -e 'for(const m of require("fs").readFileSync("wrangler.production.jsonc","utf8").matchAll(/"([^"\n]+)"/g)) console.log("::add-mask::"+m[1])'
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test
      - name: Apply D1 migrations
        run: npx wrangler d1 migrations apply DB --remote --config wrangler.production.jsonc
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Deploy Worker
        run: npx wrangler deploy --config wrangler.production.jsonc
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
