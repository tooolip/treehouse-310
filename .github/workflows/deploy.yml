name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency: deploy

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Restore private deployment configuration
        env:
          WRANGLER_CONFIG_JSON: ${{ secrets.WRANGLER_CONFIG_JSON }}
        run: |
          test -n "$WRANGLER_CONFIG_JSON"
          printf '%s' "$WRANGLER_CONFIG_JSON" > wrangler.production.jsonc
          node -e 'for(const m of require("fs").readFileSync("wrangler.production.jsonc","utf8").matchAll(/"([^"\n]+)"/g)) console.log("::add-mask::"+m[1])'
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test
      - name: Apply D1 migrations
        run: |
          if ! npx wrangler d1 migrations apply DB --remote --config wrangler.production.jsonc > "$RUNNER_TEMP/provider-migration.log" 2>&1; then
            echo "::error::Cloudflare migration failed. Check the Cloudflare dashboard for details."
            exit 1
          fi
          echo "Cloudflare migration succeeded."
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Deploy Worker
        run: |
          if ! npx wrangler deploy --config wrangler.production.jsonc > "$RUNNER_TEMP/provider-deployment.log" 2>&1; then
            echo "::error::Cloudflare deployment failed. Check the Cloudflare dashboard for details."
            exit 1
          fi
          echo "Cloudflare deployment succeeded."
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
