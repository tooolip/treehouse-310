name: iOS

on:
  push:
    paths: ['ios/**', '.github/workflows/ios.yml']
  pull_request:
    paths: ['ios/**', '.github/workflows/ios.yml']
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: macos-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Select an available iPhone simulator
        run: |
          device_id=$(xcrun simctl list devices available --json | python3 -c 'import json,sys; devices=json.load(sys.stdin)["devices"]; print(next(d["udid"] for group in devices.values() for d in group if d["name"].startswith("iPhone")))')
          echo "TREEHOUSE_SIMULATOR=$device_id" >> "$GITHUB_ENV"
      - name: Build and test without signing
        run: |
          xcodebuild -project ios/Treehouse.xcodeproj -scheme Treehouse \
            -destination "platform=iOS Simulator,id=$TREEHOUSE_SIMULATOR" \
            -derivedDataPath ios/build -resultBundlePath ios/build/Tests.xcresult \
            CODE_SIGNING_ALLOWED=NO test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-test-results
          path: ios/build/Tests.xcresult
